services:
  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      # Configuração do banco de dados
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8npass

      # Autenticação da interface web
      N8N_BASIC_AUTH_ACTIVE: "false"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: admin123

      N8N_RUNNERS_ENABLED: "true"

      # Limite de Memória do Node
      NODE_OPTIONS: "--max-old-space-size=4096"

      # Remove dados de execuções antigas automaticamente
      EXECUTIONS_DATA_PRUNE: "true"

      # Mantém execuções por 7 dias
      EXECUTIONS_DATA_MAX_AGE: "168"

      # Configuração local
      WEBHOOK_URL: "https://leadwise.duckdns.org"
      N8N_HOST: "0.0.0.0"
      N8N_PORT: "5678"
      N8N_PROXY_HOPS: 1

    volumes:
      - n8n_data:/home/node/.n8n

    depends_on:
      - postgres

  postgres:
    image: postgres:17
    container_name: n8n_postgres
    restart: always

    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8npass
      POSTGRES_DB: n8n

    volumes:
      - pg_data_17:/var/lib/postgresql/data

networks:
  default:
    external: true
    name: leadwise_n8n_net

volumes:
  n8n_data:
    name: leadwise_n8n_n8n_data

  pg_data_17:
    name: leadwise_n8n_pg_data_17
